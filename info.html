      opacity: 1;
      pointer-events: auto;

      position: absolute;

      -webkit-backdrop-filter: blur(12px);
      z-index: -1;
    }

      position: fixed;
      right: 50px;
      top: 50%;
      transform: translateY(-50%);

      z-index: 10002;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cyber-controls-3d.active {
      opacity: 1;
      pointer-events: auto;
      right: 80px;
    }

    body.settings-3d-active .music-player,
    body.settings-3d-active .menu-btn-wrap {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(20px) !important;
    }

    body.settings-3d-active .info-label {
      opacity: 0.1;
    }

    .cyber-toggle-btn.active {
      background: var(--accent);
      box-shadow: 0 0 30px var(--accent);
    }

    .hex-item:nth-child(5n) {
      transition-delay: 0.1s;
    }

    .hex-item:nth-child(5n+1) {
      transition-delay: 0.2s;
    }

    .hex-item:nth-child(5n+2) {
      transition-delay: 0.3s;
    }

    .hex-item:nth-child(5n+3) {
      transition-delay: 0.4s;
    }

    .hex-item:nth-child(5n+4) {
      transition-delay: 0.5s;
    }

    .hex-item.active-hex {
      background: rgba(178, 137, 239, 0.1);
      border: 2px solid rgba(178, 137, 239, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .hex-item.active-hex:hover {
      background: rgba(178, 137, 239, 0.25);
      border-color: #d4a8ff;
      box-shadow: 0 0 30px rgba(178, 137, 239, 0.4);
      transform: scale(1.1) translateZ(20px) !important;
    }

    .hex-item.active-hex.selected {
      background: var(--accent);
      border-color: #fff;
      color: #fff;
    }

    .hex-icon {
      width: 32px;
      height: 32px;
      color: inherit;
      transition: transform 0.3s;
    }

    .hex-item:hover .hex-icon {
      transform: scale(1.2);
    }

    .hex-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
      color: inherit;
    }

    .hex-border-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .hex-path {
      fill: none;
      stroke: rgba(178, 137, 239, 0.8);
      stroke-width: 2;
      stroke-dasharray: 60 240;
      stroke-dashoffset: 300;
      animation: hexFlow 3s linear infinite;
      filter: drop-shadow(0 0 3px rgba(178, 137, 239, 0.8));
    }


    @keyframes hexFlow {
      to {
        stroke-dashoffset: 0;
      }
    }

    .cyber-controls {
      position: absolute;
      right: 10%;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      opacity: 0;
      transition: all 0.8s ease 0.4s;
    }

    .cyber-settings.active .cyber-controls {
      opacity: 1;
      right: 5%;
    }

    .cyber-slider-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cyber-label-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .cyber-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent3);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .cyber-value {
      font-family: 'Rubik', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .cyber-range-wrap {
      position: relative;
      height: 32px;
      display: flex;
      align-items: center;
    }

    .cyber-range {
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      outline: none;
      cursor: crosshair;
    }

    .cyber-range::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border: 2px solid #fff;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 15px var(--accent);
      transition: all 0.2s;
    }

    .cyber-range::-webkit-slider-thumb:hover {
      transform: scale(1.3);
      background: #fff;
    }

    .cyber-markers {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      padding: 0 2px;
    }

    .cyber-marker {
      width: 1px;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
    }

        right: 0;
        left: 0;
        top: auto;
        bottom: 80px;
        width: 100%;
        padding: 0 20px;
        transform: none;
      }
    }

  <script>
    let prevS = -1, prevM = -1, prevH = -1, prevD = -1;

    function fmt(n) { return String(n).padStart(2, '0'); }

    function flash(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 300);
    }

    function updateLivedTime() {
      const birthDate = new Date("2004-07-04T09:00:00+07:00");
      const now = new Date();
      
      const diffMs = now - birthDate;
      const totalSecs = Math.floor(diffMs / 1000);

      let years = now.getFullYear() - birthDate.getFullYear();
      let months = now.getMonth() - birthDate.getMonth();
      let days = now.getDate() - birthDate.getDate();
      let hours = now.getHours() - birthDate.getHours();
      let minutes = now.getMinutes() - birthDate.getMinutes();
      let seconds = now.getSeconds() - birthDate.getSeconds();

      if (seconds < 0) { seconds += 60; minutes--; }
      if (minutes < 0) { minutes += 60; hours--; }
      if (hours < 0) { hours += 24; days--; }
      if (days < 0) {
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
        months--;
      }
      if (months < 0) { months += 12; years--; }

      const els = {
        y: document.getElementById('y'),
        mo: document.getElementById('mo'),
        d: document.getElementById('d'),
        h: document.getElementById('h'),
        m: document.getElementById('m'),
        s: document.getElementById('s'),
        total: document.getElementById('total-s'),
        prog: document.getElementById('prog'),
        pct: document.getElementById('pct'),
        yearLabel: document.getElementById('year-label')
      };

      if (els.y) els.y.textContent = years;
      if (els.mo) els.mo.textContent = fmt(months);
      if (els.d) els.d.textContent = fmt(days);
      if (els.h) els.h.textContent = fmt(hours);
      if (els.m) els.m.textContent = fmt(minutes);
      if (els.s) els.s.textContent = fmt(seconds);
      if (els.total) els.total.textContent = totalSecs.toLocaleString();
      if (els.yearLabel) els.yearLabel.textContent = `Năm thứ ${years + 1}`;

      if (seconds !== prevS) { flash('s'); prevS = seconds; }
      if (minutes !== prevM) { flash('m'); prevM = minutes; }
      if (hours !== prevH) { flash('h'); prevH = hours; }
      if (days !== prevD) { flash('d'); prevD = days; }

      const daysInYear = (years % 4 === 0 && (years % 100 !== 0 || years % 400 === 0)) ? 366 : 365;
      const startOfYear = new Date(now.getFullYear(), birthDate.getMonth(), birthDate.getDate(), birthDate.getHours(), birthDate.getMinutes(), birthDate.getSeconds());
      if (now < startOfYear) startOfYear.setFullYear(now.getFullYear() - 1);
      
      const yearDiffMs = now - startOfYear;
      const yearPct = Math.min(100, (yearDiffMs / (daysInYear * 86400000)) * 100).toFixed(1);

      if (els.prog) els.prog.style.width = yearPct + '%';
      if (els.pct) els.pct.textContent = yearPct + '%';
    }

    window._livedTimeInterval = setInterval(updateLivedTime, 1000);
    updateLivedTime();
  </script>
