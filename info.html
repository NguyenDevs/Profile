    <style>
    body {
      background: #08080e !important;
      overflow: hidden;
    }

    .info-label {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      text-align: center;
      pointer-events: none;
    }
    .info-label__eyebrow {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: none;
      font-variant-numeric: tabular-nums;
      color: rgba(255,136,0,0.7);
      margin-bottom: 4px;
    }
    .info-label__title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.1rem,3vw,1.6rem);
      font-weight: 800;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .info-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    .cyber-settings {
      position: fixed;
      inset: 0;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cyber-settings.active {
      opacity: 1;
      pointer-events: auto;
    }

    .cyber-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 10, 30, 0.85) 0%, rgba(5, 5, 10, 0.98) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: -1;
    }

    .cyber-controls-3d {
      position: fixed;
      right: 50px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      z-index: 10002;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cyber-controls-3d.active {
      opacity: 1;
      pointer-events: auto;
      right: 80px;
    }

    body.settings-3d-active .music-player,
    body.settings-3d-active .menu-btn-wrap {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(20px) !important;
    }
    body.settings-3d-active .info-label {
      opacity: 0.1;
    }

    .cyber-toggle-btn.active {
      background: var(--accent);
      box-shadow: 0 0 30px var(--accent);
    }

    .hex-item:nth-child(5n) { transition-delay: 0.1s; }
    .hex-item:nth-child(5n+1) { transition-delay: 0.2s; }
    .hex-item:nth-child(5n+2) { transition-delay: 0.3s; }
    .hex-item:nth-child(5n+3) { transition-delay: 0.4s; }
    .hex-item:nth-child(5n+4) { transition-delay: 0.5s; }

    .hex-item.active-hex {
      background: rgba(178, 137, 239, 0.1);
      border: 2px solid rgba(178, 137, 239, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .hex-item.active-hex:hover {
      background: rgba(178, 137, 239, 0.25);
      border-color: #d4a8ff;
      box-shadow: 0 0 30px rgba(178, 137, 239, 0.4);
      transform: scale(1.1) translateZ(20px) !important;
    }

    .hex-item.active-hex.selected {
      background: var(--accent);
      border-color: #fff;
      color: #fff;
    }

    .hex-icon { width: 32px; height: 32px; color: inherit; transition: transform 0.3s; }
    .hex-item:hover .hex-icon { transform: scale(1.2); }

    .hex-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
      color: inherit;
    }

    .hex-border-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .hex-path {
      fill: none;
      stroke: rgba(178, 137, 239, 0.8);
      stroke-width: 2;
      stroke-dasharray: 60 240;
      stroke-dashoffset: 300;
      animation: hexFlow 3s linear infinite;
      filter: drop-shadow(0 0 3px rgba(178, 137, 239, 0.8));
    }


    @keyframes hexFlow {
      to { stroke-dashoffset: 0; }
    }

    .cyber-controls {
      position: absolute;
      right: 10%;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      opacity: 0;
      transition: all 0.8s ease 0.4s;
    }

    .cyber-settings.active .cyber-controls {
      opacity: 1;
      right: 5%;
    }

    .cyber-slider-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cyber-label-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .cyber-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent3);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .cyber-value {
      font-family: 'Rubik', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .cyber-range-wrap {
      position: relative;
      height: 32px;
      display: flex;
      align-items: center;
    }

    .cyber-range {
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      outline: none;
      cursor: crosshair;
    }

    .cyber-range::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border: 2px solid #fff;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 15px var(--accent);
      transition: all 0.2s;
    }

    .cyber-range::-webkit-slider-thumb:hover {
      transform: scale(1.3);
      background: #fff;
    }

    .cyber-markers {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      padding: 0 2px;
    }

    .cyber-marker {
      width: 1px;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
    }

    .cyber-toggle-btn {
      position: fixed;
      top: 28px;
      right: 28px;
      width: 52px;
      height: 52px;
      z-index: 10001;
      background: rgba(8, 2, 18, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(178, 137, 239, 0.4);
      border-radius: 14px;
      color: #b289ef;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
      box-shadow: 0 0 15px rgba(178, 137, 239, 0.2);
    }

    .cyber-toggle-btn:hover {
      background: #b289ef;
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 25px rgba(178, 137, 239, 0.6);
      transform: scale(1.1);
    }

    .cyber-toggle-btn svg { width: 24px; height: 24px; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .cyber-settings.active + .cyber-toggle-btn svg { transform: rotate(180deg) scale(0.8); }

    .cyber-toggle-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }
    .cyber-toggle-btn:hover::before { transform: translateX(100%); }

    .cyber-toggle-btn::after {
      content: 'SETTINGS';
      position: absolute;
      bottom: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 6px;
      font-weight: 900;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
    }
    .cyber-toggle-btn:hover::after { opacity: 0.6; transform: translateY(0); }

    @media (max-width: 768px) {
      .cyber-controls {
        right: 50%;
        top: auto;
        bottom: 80px;
        transform: translateX(50%);
        width: calc(100% - 60px);
      }
      .hex-grid {
        grid-template-columns: repeat(8, 60px);
        grid-auto-rows: 70px;
        transform: scale(0.6);
      }
    }
    </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="assets/js/threejs-bg.js"></script>
  <script src="assets/js/endsky-bg.js"></script>

  <script>
    function updateLivedTime() {
      const birthDate = new Date("2004-07-04T09:00:00+07:00");
      const now = new Date();

      let years = now.getFullYear() - birthDate.getFullYear();
      let months = now.getMonth() - birthDate.getMonth();
      let days = now.getDate() - birthDate.getDate();
      let hours = now.getHours() - birthDate.getHours();
      let minutes = now.getMinutes() - birthDate.getMinutes();
      let seconds = now.getSeconds() - birthDate.getSeconds();

      if (seconds < 0) {
          seconds += 60;
          minutes--;
      }
      if (minutes < 0) {
          minutes += 60;
          hours--;
      }
      if (hours < 0) {
          hours += 24;
          days--;
      }
      if (days < 0) {
          const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
          days += prevMonth.getDate();
          months--;
      }
      if (months < 0) {
          months += 12;
          years--;
      }

      const display = document.getElementById("time-lived-display");
      if (display) {
          display.innerHTML = `NguyenDevs has lived for ${years} years, ${months} months, ${days} days, ${hours} hours, ${minutes} minutes and ${seconds} seconds.`;
      }
    }
    window._livedTimeInterval = setInterval(updateLivedTime, 1000);
    updateLivedTime();
  </script>
